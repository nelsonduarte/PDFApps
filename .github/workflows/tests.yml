name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Three jobs written out instead of one matrix. Only "pytest (Ubuntu,
# Python 3.14)" is a required check on main: a matrix would make its
# name a template, and fail-fast would cancel it when another leg
# fails. tests/test_updater_apply.py also names the three job ids.
# pytest-windows runs the Windows-only tests, which skip on Linux, on
# the platform the Store and PDFAppsSetup.exe builds target.
# pytest-py312 runs the suite on the Python of the core24 snap base.
# Neither is required (the ruleset decides that, not this file), and
# neither has continue-on-error: a failure there must show as red.
jobs:
  pytest:
    name: pytest (Ubuntu, Python 3.14)
    # Pinned instead of ubuntu-latest: GitHub moves that label to Ubuntu
    # 26.04 from 2026-10-19, and the runner image should change when we
    # choose, not on that date. Move to ubuntu-26.04 once a run there has
    # validated the "Install Qt system deps" step and the rest of the job.
    # The job name above is the required check context; keep it unchanged.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the v1.15.2 tag
        # test_v1152_refuses_the_renamed_asset runs the updater v1.15.2
        # shipped, and skips without this tag. One tag at depth 1 is about
        # 2 MB, 1.4 s from a home connection (2026-11-05); fetch-tags with
        # fetch-depth 1 would bring all 48 tags, about 250 MB.
        run: git fetch --no-tags --depth=1 origin +refs/tags/v1.15.2:refs/tags/v1.15.2

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install Qt system deps
        # Two packages where build.yml's "Install Linux system deps" has
        # three: that job freezes the app with PyInstaller, this one only
        # runs the suite, with QT_QPA_PLATFORM=offscreen set on the "Run
        # test suite" step. PySide6 facts below are for 6.11.2.
        #
        # libxcb-cursor0 is left out: libxcb-cursor.so.0 is DT_NEEDED
        # only by libqxcb.so, libQt6XcbQpa.so.6 and the two
        # xcbglintegrations plugins, and a full offscreen run of this
        # suite under LD_DEBUG=files (Ubuntu 26.04) loaded none of them.
        #
        # libQt6Gui.so.6 has libEGL.so.1 and libxkbcommon.so.0 as
        # DT_NEEDED entries; with either one absent, `from PySide6 import
        # QtGui` raises ImportError. On image ubuntu-24.04
        # 20260927.320.1, apt-get installed libegl1 as a new package and
        # found libxkbcommon0 already installed.
        #
        # libqoffscreen.so and libQt6Gui.so.6 also need libX11.so.6 and
        # libGL.so.1, and libX11.so.6 needs libxcb.so.1. None of the
        # packages apt-get installed or upgraded there ships any of the
        # three, so the image already had them. Of these three, only
        # libGL.so.1 depends on the image alone: libx11-6 and libxcb1
        # would also come in with libegl1 (via libegl-mesa0 on Ubuntu
        # 24.04 and 26.04), libgl1 would not. A missing one fails the
        # same way, with an ImportError naming it.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # requirements-dev.txt carries the test runners (pytest,
          # pytest-qt) plus ruff and PyYAML, which parts of the suite
          # invoke as subprocesses / import directly rather than
          # skipping when absent.
          pip install -r requirements-dev.txt

      - name: Run test suite
        env:
          # Mandatory: the suite instantiates real QWidgets, and the
          # default xcb plugin aborts with "could not connect to
          # display" on a headless runner.
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q -rs

  pytest-windows:
    name: pytest (Windows, Python 3.14)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        # Git Bash, so the run blocks below mean what they mean on Linux.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the v1.15.2 tag
        # Same reason as in the pytest job: without the tag,
        # test_v1152_refuses_the_renamed_asset skips.
        run: git fetch --no-tags --depth=1 origin +refs/tags/v1.15.2:refs/tags/v1.15.2

      - name: Set up Python 3.14
        # The version build.yml freezes the Windows binaries with.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        # faulthandler_timeout dumps every thread's stack when one test
        # runs past 300 s, and exit_on_timeout then ends the process, so
        # a hang fails with a traceback instead of eating the job's 30
        # minutes in silence. --durations and the JUnit file measure
        # where the time goes on this runner.
        run: |
          python -m pytest -q -rs --durations=25 -o faulthandler_timeout=300 -o faulthandler_exit_on_timeout=true --junitxml=junit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-windows-py314
          path: junit.xml

  pytest-py312:
    name: pytest (Ubuntu 24.04, Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the v1.15.2 tag
        # Same reason as in the pytest job: without the tag,
        # test_v1152_refuses_the_renamed_asset skips.
        run: git fetch --no-tags --depth=1 origin +refs/tags/v1.15.2:refs/tags/v1.15.2

      - name: Set up Python 3.12.3
        # 3.12.3 and not 3.12: Ubuntu 24.04 ships python3.12 as upstream
        # 3.12.3 plus security patches (3.12.3-1ubuntu0.17 on Launchpad,
        # 2026-11-08), the package a core24 snap's Python comes from.
        # "3.12" would resolve to the newest 3.12.x and could pass on
        # standard library behaviour from a later patch release that the
        # snap lacks. Ubuntu's patches are not in this build either, so
        # it is the closest match, not an exact one.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.3'

      - name: Install Qt system deps
        # The same two packages as the pytest job; the reasons are there.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q -rs
