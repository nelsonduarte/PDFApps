name: pdfapps
title: PDFApps
base: core22
version: '1.15.2'
summary: Free, offline PDF editor with 15 tools. Your files stay on your computer.
description: |
  PDFApps is a free, open source PDF editor that works entirely on your
  computer. There are no subscriptions, no accounts and no cloud uploads,
  so your documents stay private.

  Organize pages
  - Split, merge, rotate, extract and reorder
  - Add page numbers
  - Place several pages on one sheet (N-up)

  Edit and protect
  - Visual editor: redact, add text, images, signatures, highlights and notes
  - Add a watermark
  - Encrypt or decrypt with a password
  - Compress to reduce file size

  Convert
  - OCR: make scanned PDFs searchable (English, Portuguese, Spanish,
    French and German)
  - Export to DOCX, PPTX, XLSX, TXT, HTML, EPUB, PNG or JPG
  - Create PDFs from text, images and Markdown

  Read comfortably
  - Continuous scrolling and tabs
  - Presentation mode (F5) and fullscreen (F11)
  - Dark and light themes
  - Drag and drop, and opening several PDFs at once
  - Available in English, Portuguese, Spanish, French, German, Chinese,
    Italian and Dutch

grade: stable
confinement: strict
license: MIT
website: https://pdf-apps.com
source-code: https://github.com/nelsonduarte/PDFApps
issues: https://github.com/nelsonduarte/PDFApps/issues
contact: https://github.com/nelsonduarte/PDFApps/issues
donation: https://github.com/sponsors/nelsonduarte
icon: snap/gui/pdfapps.png

architectures:
  - build-on: amd64

apps:
  pdfapps:
    command: bin/pdfapps
    common-id: io.github.nelsonduarte.PDFApps
    desktop: usr/share/applications/io.github.nelsonduarte.PDFApps.desktop
    plugs:
      - home
      - removable-media
      - cups
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - opengl
      - audio-playback
    environment:
      PYTHONPATH: "$SNAP/lib/python3.10/site-packages:$SNAP/usr/lib/python3/dist-packages"
      QT_PLUGIN_PATH: "$SNAP/lib/python3.10/site-packages/PySide6/Qt/plugins"
      QT_QPA_PLATFORM_PLUGIN_PATH: "$SNAP/lib/python3.10/site-packages/PySide6/Qt/plugins/platforms"
      QT_QPA_PLATFORM: "xcb;wayland"
      LD_LIBRARY_PATH: "$SNAP/lib/python3.10/site-packages/PySide6/Qt/lib:$LD_LIBRARY_PATH"
      FONTCONFIG_PATH: "$SNAP/etc/fonts"
      # The base has no XKB data and libxkbcommon looks in /usr/share/X11/xkb,
      # so without this the Wayland plugin dies with "failed to create xkb
      # context" (rc=139). The xcb plugin takes its keymap from the X server.
      XKB_CONFIG_ROOT: "$SNAP/usr/share/X11/xkb"

parts:
  pdfapps:
    plugin: python
    source: .
    python-requirements:
      - requirements.txt
    build-packages:
      - python3-dev
      - libgl1-mesa-dev
    stage-packages:
      - libxkbcommon0
      - xkb-data
      - libegl1
      - libgl1
      - libglib2.0-0
      - libxcb1
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-shm0
      - libxcb-sync1
      - libxcb-xfixes0
      - libxcb-xinerama0
      - libxcb-xkb1
      - libxkbcommon-x11-0
      - libdbus-1-3
      - libfontconfig1
      - libfreetype6
      - libxrender1
      - libxext6
      - libxi6
      - libxrandr2
      - libxss1
      - libxtst6
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - tesseract-ocr
      - tesseract-ocr-eng
      - tesseract-ocr-por
      - tesseract-ocr-spa
      - tesseract-ocr-fra
      - tesseract-ocr-deu
      - ghostscript
    override-build: |
      craftctl default
      install -d $CRAFT_PART_INSTALL/usr/lib/pdfapps
      cp -r app pdfapps.py icon.ico icon_512.png pdfapps.svg \
        $CRAFT_PART_INSTALL/usr/lib/pdfapps/
      install -d $CRAFT_PART_INSTALL/bin
      cat > $CRAFT_PART_INSTALL/bin/pdfapps <<'EOF'
      #!/bin/sh
      # snapd moves XDG_RUNTIME_DIR to /run/user/<uid>/snap.pdfapps and leaves
      # the compositor's socket one level up, so a relative WAYLAND_DISPLAY
      # finds nothing and Qt aborts ("Failed to create wl_display", rc=134)
      # when no Xwayland lets xcb, tried first, win. libwayland takes an
      # absolute path. Without Wayland, or with the socket in place, nothing
      # changes, and the relaunch after a language change keeps the absolute
      # value it inherited.
      case "$WAYLAND_DISPLAY" in
        ''|/*) ;;
        *)
          if [ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then
            _socket="$(dirname "$XDG_RUNTIME_DIR")/$WAYLAND_DISPLAY"
            [ -S "$_socket" ] && export WAYLAND_DISPLAY="$_socket"
          fi
          ;;
      esac
      cd "$SNAP/usr/lib/pdfapps"
      exec python3 pdfapps.py "$@"
      EOF
      chmod +x $CRAFT_PART_INSTALL/bin/pdfapps
      install -d $CRAFT_PART_INSTALL/usr/share/applications
      cp data/io.github.nelsonduarte.PDFApps.desktop \
        $CRAFT_PART_INSTALL/usr/share/applications/
      install -d $CRAFT_PART_INSTALL/usr/share/metainfo
      cp data/io.github.nelsonduarte.PDFApps.metainfo.xml \
        $CRAFT_PART_INSTALL/usr/share/metainfo/
      install -Dm644 icon_512.png \
        $CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps/io.github.nelsonduarte.PDFApps.png
      install -Dm644 pdfapps.svg \
        $CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/io.github.nelsonduarte.PDFApps.svg
